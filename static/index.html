<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetScar // Network Scanner v0.1.1</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f0f0f;
    --bg2: #181818;
    --bg3: #222222;
    --border: rgba(255,255,255,0.08);
    --text: #f7f7f7;
    --muted: #a8a8a8;
    --accent: #ffffff;
    --danger: #ff4d4d;
    --success: #b8b8b8;
    --btn: rgba(255,255,255,0.08);
    --btn-hover: rgba(255,255,255,0.14);
    --green: #f7f7f7;
    --green-dim: #a8a8a8;
    --green-dark: #181818;
    --amber: #c7c7c7;
    --blue: #c7c7c7;
    --red: #ff4d4d;
  }

  body {
    background: radial-gradient(circle at top left, rgba(255,255,255,0.05), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255,255,255,0.03), transparent 25%),
                var(--bg);
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
  }

  .shell { max-width: 1300px; margin: 0 auto; padding: 20px; }

  .header {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid var(--border);
    border-bottom: 2px solid rgba(255,255,255,0.16);
    padding: 18px 24px; margin-bottom: 18px; background: var(--bg2);
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.25);
  }

  .logo { font-family: 'Orbitron', sans-serif; font-size: 24px; font-weight: 900; letter-spacing: 4px; color: var(--accent); }
  .logo span { color: var(--muted); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
    gap: 16px;
  }

  .panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.16);
  }

  .panel-header {
    padding: 16px 18px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 1.8px;
    color: var(--muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-body { padding: 18px; }

  .count-badge {
    margin-left: 12px;
    padding: 4px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    background: rgba(255,255,255,0.03);
  }

  .full { grid-column: 1 / -1; }

  /* Button Styling */
  .action-btn, .test-btn {
    background: var(--btn);
    border: 1px solid rgba(255,255,255,0.16);
    color: var(--text);
    padding: 10px 18px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    border-radius: 12px;
  }

  .action-btn:hover, .test-btn:hover {
    background: var(--btn-hover);
    border-color: rgba(255,255,255,0.24);
  }

  .test-btn {
    width: 100%;
    padding: 14px;
    font-size: 13px;
    margin-top: 10px;
  }

  /* Speed Test */
  .speed-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }

  .speed-card {
    border: 1px solid var(--border);
    padding: 18px;
    text-align: center;
    background: var(--bg3);
    border-radius: 16px;
  }

  .speed-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
  }
  .speed-value.amber { color: var(--muted); }
  .speed-value.blue { color: var(--muted); }

  .device-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  th, td {
    padding: 14px 12px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    color: var(--muted);
  }
  tr:hover td { background: rgba(255,255,255,0.05); }
  tr.new-device { background: rgba(255,255,255,0.04); }
</style>
</head>
<body>

<div class="shell">

  <div class="header">
    <div class="logo">NET<span>SCAR</span> <span style="font-size:13px;color:var(--green-dim);">// v0.1.1</span></div>
    <div class="header-right">
      <div><span class="status-dot"></span>SYSTEM ACTIVE</div>
      <div class="sys-time" id="clock">--:--:--</div>
      <div id="backend-status" style="color:var(--amber); font-size:12px;">● CONNECTING...</div>
    </div>
  </div>

  <div class="grid">

    <!-- SPEED TEST(To fix does not work) -->
    <div class="panel full">
      <div class="panel-header"><span class="label">// INTERNET SPEED TEST</span></div>
      <div class="panel-body">
        <div class="speed-grid">
          <div class="speed-card"><div class="speed-label">↓ DOWNLOAD</div><div class="speed-value" id="dl-val">--.-</div><div style="color:var(--green-dim)">Mbps</div></div>
          <div class="speed-card"><div class="speed-label">↑ UPLOAD</div><div class="speed-value amber" id="ul-val">--.-</div><div style="color:var(--green-dim)">Mbps</div></div>
          <div class="speed-card"><div class="speed-label">◎ PING</div><div class="speed-value blue" id="ping-val">---</div><div style="color:var(--green-dim)">ms</div></div>
        </div>
        <button onclick="runSpeedTest()" class="test-btn" id="test-btn">[ RUN SPEED TEST ]</button>
      </div>
    </div>

    <!-- CONNECTED DEVICES -->
    <div class="panel full">
      <div class="panel-header">
        <div>
          <span class="label">// CONNECTED DEVICES</span>
          <span id="device-count" class="count-badge">0 DEVICES</span>
        </div>
        <button onclick="startScan()" class="action-btn">SCAN NETWORK</button>
      </div>
      <div class="panel-body" style="padding:0">
        <table class="device-table">
          <thead>
            <tr>
              <th>IP ADDRESS</th>
              <th>MAC</th>
              <th>VENDOR</th>
              <th>TYPE</th>
              <th>STATUS</th>
              <th>ACTION</th>
            </tr>
          </thead>
          <tbody id="device-tbody"></tbody>
        </table>
      </div>
    </div>

    <!-- BANDWIDTH USAGE -->
    <div class="panel">
      <div class="panel-header">
        <span class="label">// LIVE BANDWIDTH USAGE (Scapy Demo)</span>
        <button onclick="toggleSniffer()" class="action-btn" id="sniffer-btn">START SNIFFER</button>
      </div>
      <div class="panel-body">
        <div id="bandwidth-list" style="line-height:1.8; min-height:180px;"></div>
      </div>
    </div>

    <!-- PACKET LOG -->
    <div class="panel">
      <div class="panel-header">
        <span class="label">// PACKET LOG</span>
        <button onclick="exportPacketLogs()" class="action-btn" style="font-size:11px; padding:6px 10px;">EXPORT PACKETS</button>
      </div>
      <div class="panel-body">
        <div id="packet-log" style="max-height: 220px; overflow-y: auto; font-size:12px; color:var(--text); line-height:1.6;">
        </div>
      </div>
    </div>

    <!-- HISTORICAL LOGS -->
    <div class="panel full">
      <div class="panel-header">
        <span class="label">// EVENT LOGS</span>
        <button onclick="exportLogs()" class="action-btn" style="font-size:11px; padding:6px 10px;">EXPORT LOGS</button>
      </div>
      <div class="panel-body">
        <div id="history-log" style="max-height: 220px; overflow-y: auto; font-size:11px; color:var(--green-dim);"></div>
      </div>
    </div>

  </div>
</div>

<script>
// ==================== NetScar v0.1.1 - Poopoo version ====================

let snifferRunning = false;

function updateClock() {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0,8);
}

// Backend Status
async function checkBackendStatus() {
  try {
    await fetch('/api/devices');
    document.getElementById('backend-status').innerHTML = '● BACKEND CONNECTED';
    document.getElementById('backend-status').style.color = 'var(--green)';
  } catch (e) {
    document.getElementById('backend-status').innerHTML = '● BACKEND OFFLINE';
    document.getElementById('backend-status').style.color = 'var(--red)';
  }
}

// SPEED TEST
async function runSpeedTest() {
  const btn = document.getElementById('test-btn');
  const dlEl = document.getElementById('dl-val');
  const ulEl = document.getElementById('ul-val');
  const pingEl = document.getElementById('ping-val');

  btn.textContent = '[ TESTING... ]';
  btn.disabled = true;
  dlEl.textContent = '...';
  ulEl.textContent = '...';
  pingEl.textContent = '...';

  try {
    const res = await fetch('/api/speed-test');
    if (!res.ok) throw new Error('Speed test failed');
    const data = await res.json();

    pingEl.textContent = data.ping_ms !== null ? data.ping_ms : 'N/A';
    dlEl.textContent = data.download_mbps !== null ? `${data.download_mbps}` : 'ERR';
    ulEl.textContent = data.upload_mbps !== null ? `${data.upload_mbps}` : 'ERR';
  } catch (e) {
    console.warn('Speed test failed', e);
    pingEl.textContent = 'ERR';
    dlEl.textContent = 'ERR';
    ulEl.textContent = 'ERR';
  }

  btn.textContent = '[ RUN SPEED TEST ]';
  btn.disabled = false;
}

// DEVICES
async function loadDevices() {
  try {
    const res = await fetch('/api/devices');
    const data = await res.json();

    const countEl = document.getElementById('device-count');
    if (countEl) {
      countEl.textContent = `${data.devices.length} DEVICES`;
    }

    const tbody = document.getElementById('device-tbody');
    tbody.innerHTML = data.devices.map(dev => {
      const rowClass = dev.is_new ? 'new-device' : '';
      const ipStyle = dev.is_suspicious ? 'color:var(--red); font-weight:bold;' : '';
      const suspiciousFlag = dev.is_suspicious ? 'X' : '';
      const suspiciousTooltip = dev.is_suspicious ? ` title="${dev.suspicious_reason}"` : '';
      return `
        <tr class="${rowClass}">
          <td><strong style="${ipStyle}">${suspiciousFlag}${dev.ip}</strong></td>
          <td style="color:var(--green-dim);font-size:11px">${dev.mac}</td>
          <td style="color:var(--amber);font-size:11px">${dev.vendor}</td>
          <td>${dev.type}</td>
          <td><span class="device-status trusted">ONLINE</span></td>
          <td><button class="action-btn" onclick="pingDevice('${dev.ip}')">PING</button></td>
        </tr>
      `;
    }).join('');
  } catch (e) {
    console.error(e);
  }
}

async function startScan() {
  try {
    await fetch('/api/scan', { method: 'POST' });
    setTimeout(loadDevices, 3500);
  } catch(e) {}
}

async function pingDevice(ip) {
  try {
    const response = await fetch(`/api/ping/${ip}`);
    const result = await response.json();

    if (!result.success) {
      alert(`Could not fingerprint ${ip}\n${result.error || 'Host unreachable'}`);
      return;
    }

    // Build OS detection display
    let osInfo = "OS FINGERPRINT RESULTS:\n" + "=".repeat(40) + "\n";
    
    if (result.os_guesses && result.os_guesses.length > 0) {
      osInfo += "\nDETECTED OPERATING SYSTEMS:\n";
      result.os_guesses.forEach((os, idx) => {
        osInfo += `${idx + 1}. ${os.name}\n   Confidence: ${os.accuracy}%\n`;
        if (os.cpe && os.cpe.length > 0) {
          osInfo += `   CPE: ${os.cpe[0]}\n`;
        }
      });
    } else {
      osInfo += "No OS detected (host may be filtering probes)\n";
    }

    // Add detected services
    if (result.services && result.services.length > 0) {
      osInfo += "\n🔌 DETECTED SERVICES:\n";
      result.services.slice(0, 5).forEach(svc => {
        osInfo += `Port ${svc.port}/${svc.state}: ${svc.name}`;
        if (svc.product) osInfo += ` (${svc.product}`;
        if (svc.version) osInfo += ` ${svc.version}`;
        if (svc.product) osInfo += `)`;
        osInfo += "\n";
      });
      if (result.services.length > 5) {
        osInfo += `... and ${result.services.length - 5} more services\n`;
      }
    }

    osInfo += `\nHost Status: ${result.status.toUpperCase()}`;
    alert(osInfo);
  } catch(e) {
    alert(`Error fingerprinting ${ip}: ${e.message}`);
  }
}

// BANDWIDTH
async function loadBandwidth() {
  try {
    const res = await fetch('/api/bandwidth');
    const data = await res.json();
    
    const container = document.getElementById('bandwidth-list');
    if (data.length === 0) {
      container.innerHTML = "<div style='color:var(--green-dim)'>Waiting for network traffic...</div>";
      return;
    }

    container.innerHTML = data.map(item => `
      <div style="display:flex; justify-content:space-between; margin:6px 0; padding:4px 0;">
        <span><strong>${item.ip}</strong></span>
        <span style="color:var(--amber)">${item.usage_str}</span>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('bandwidth-list').innerHTML = "<div style='color:var(--red)'>Bandwidth monitor not ready</div>";
  }
}

// HISTORY
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const data = await res.json();
    const logDiv = document.getElementById('history-log');
    logDiv.innerHTML = data.history.slice(-15).map(entry => `
      <div>[${new Date(entry.timestamp).toLocaleTimeString()}] ${entry.event}${entry.details ? ' - ' + entry.details : ''}${entry.ip ? ' → ' + entry.ip : ''}</div>
    `).join('');
  } catch(e) {
    console.error('History load failed', e);
  }
}

// PACKET LOGGER (if it wants to work)
async function loadPackets() {
  try {
    const res = await fetch('/api/packets');
    const data = await res.json();
    const container = document.getElementById('packet-log');
    if (data.packets.length === 0) {
      container.innerHTML = "<div style='color:var(--green-dim)'>Waiting for packet captures...</div>";
      return;
    }

    container.innerHTML = data.packets.slice(-20).reverse().map(entry => `
      <div style="padding:10px 12px; margin-bottom:10px; border-radius:12px; background: rgba(255,255,255,0.04);">
        <div style="font-size:10px; color:var(--muted);">[${new Date(entry.timestamp).toLocaleTimeString()}]</div>
        <div style="margin:4px 0; color:var(--text);"><strong>${entry.src}</strong> → <strong>${entry.dst}</strong> <span style="color:var(--muted)">(${entry.length} bytes)</span></div>
        <div style="font-size:11px; color:var(--muted);">${entry.summary}</div>
      </div>
    `).join('');
  } catch(e) {
    const container = document.getElementById('packet-log');
    if (container) {
      container.innerHTML = "<div style='color:var(--red)'>Packet log unavailable</div>";
    }
  }
}

function downloadTextFile(filename, contents) {
  const blob = new Blob([contents], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = filename;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
}

async function exportLogs() {
  try {
    const [historyRes, packetsRes] = await Promise.all([
      fetch('/api/history'),
      fetch('/api/packets')
    ]);
    const historyData = await historyRes.json();
    const packetsData = await packetsRes.json();
    const now = new Date();
    const timestamp = now.toISOString().replace(/[:.]/g, '-');

    const historyText = historyData.history.map(entry =>
      `[${new Date(entry.timestamp).toLocaleString()}] ${entry.event}${entry.details ? ' - ' + entry.details : ''}${entry.ip ? ' → ' + entry.ip : ''}`
    ).join('\n') || 'No event history available.';

    const packetText = packetsData.packets.map(entry =>
      `[${new Date(entry.timestamp).toLocaleString()}] ${entry.src} → ${entry.dst} (${entry.length} bytes) ${entry.summary}`
    ).join('\n') || 'No packet log entries available.';

    downloadTextFile(`netscar-events-${timestamp}.log`, historyText);
    downloadTextFile(`netscar-packets-${timestamp}.log`, packetText);
  } catch (e) {
    alert('Export failed: ' + (e.message || 'Unable to fetch logs.'));
  }
}


async function exportPacketLogs() {
  try {
    const res = await fetch('/api/packets');
    const packetsData = await res.json();
    const now = new Date();
    const timestamp = now.toISOString().replace(/[:.]/g, '-');

    const packetText = packetsData.packets.map(entry =>
      `[${new Date(entry.timestamp).toLocaleString()}] ${entry.src} → ${entry.dst} (${entry.length} bytes) ${entry.summary}`
    ).join('') || 'No packet log entries available.';

    downloadTextFile(`netscar-packets-${timestamp}.log`, packetText);
  } catch (e) {
    alert('Packet export failed: ' + (e.message || 'Unable to fetch packet logs.'));
  }
}

// SNIFFER CONTROL
async function toggleSniffer() {
  const btn = document.getElementById('sniffer-btn');
  const action = snifferRunning ? 'stop' : 'start';
  
  try {
    const res = await fetch('/api/sniffer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action })
    });
    
    if (res.ok) {
      snifferRunning = !snifferRunning;
      btn.textContent = snifferRunning ? "STOP SNIFFER" : "START SNIFFER";
      btn.style.color = snifferRunning ? "var(--red)" : "var(--green)";
    }
  } catch (e) {
    alert("Failed to toggle sniffer.");
  }
}

// Initialize
window.onload = () => {
  updateClock();
  setInterval(updateClock, 1000);

  checkBackendStatus();
  setInterval(checkBackendStatus, 8000);

  loadDevices();
  setInterval(loadDevices, 2000);

  loadBandwidth();
  setInterval(loadBandwidth, 4000);

  loadPackets();
  setInterval(loadPackets, 2000);

  loadHistory();
  setInterval(loadHistory, 10000);

  setTimeout(startScan, 1500);
};
</script>
</body>
</html>
